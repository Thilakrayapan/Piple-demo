name: Maven Build

on: 
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
     runs-on: ubuntu-latest

     steps:
        - name: Checkout code
          uses: actions/checkout@v4
          
        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            java-version: '25'
            distribution: 'temurim'

        - name: Build with Maven
          working-directory: MyWebApp
          run: mvn clean package
          







      
